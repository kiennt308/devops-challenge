server {
    listen 80;

    # Use Docker's embedded DNS server (127.0.0.11) with a variable-based upstream target
    # so NGINX dynamically re-resolves the `api` container IP (TTL 10s) if the container
    # is recreated with a new IP address on frontend_net.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $api_upstream "api:3000";

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location = /healthz {
        proxy_pass http://$api_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /status {
        proxy_pass http://$api_upstream/status;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

